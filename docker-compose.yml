version: '3.8'

services:
  web:
    build: .
    command: sh -c "alembic upgrade head && uvicorn eve_health.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://eve_user:eve_password@db:5432/eve_db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: ["celery", "-A", "eve_health.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql://eve_user:eve_password@db:5432/eve_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=eve_user
      - POSTGRES_PASSWORD=eve_password
      - POSTGRES_DB=eve_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_db"]
      interval: 5s
      timeout: 5s
      retries: 5
